name: ci

# The per-PR machine gate: the project's Verify + Build (docs/workflow.md
# Commands) on every pull request, plus push-to-main to catch anything that
# slipped. The job is named `ci` so branch protection can require it by name.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
        env:
          # Public NEXT_PUBLIC_* values (already in the client bundle), supplied
          # as repository variables, not secrets — the build reads them at
          # prerender time.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
